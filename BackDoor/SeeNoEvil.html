
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOL, GET REKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#06070c;
    --green:#3dffa0;
    --green-dim:#1c8a5c;
    --magenta:#ff2f6e;
    --cyan:#2fe3ff;
    --text-dim:#7d8a8f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--void);color:var(--green);
    font-family:'JetBrains Mono',monospace;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;position:relative;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  canvas#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.35;}
  .scanlines{position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.25) 3px);
    mix-blend-mode:multiply;}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.78) 100%);}
  main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    gap:22px;padding:24px;max-width:92vw;}
  svg#skull{width:88px;height:88px;filter:drop-shadow(0 0 10px rgba(61,255,160,.5));}
  h1{font-family:'Press Start 2P',monospace;font-size:clamp(13px,4vw,32px);line-height:1.7;
    text-align:center;margin:0;letter-spacing:2px;color:var(--green);
    text-shadow:0 0 6px rgba(61,255,160,.6);}
  h1 .glitch{position:relative;display:inline-block;}
  h1 .glitch::before,h1 .glitch::after{content:attr(data-text);position:absolute;left:0;top:0;
    width:100%;overflow:hidden;background:var(--void);}
  h1 .glitch::before{color:var(--magenta);animation:glitchTop 4.5s infinite steps(1);}
  h1 .glitch::after{color:var(--cyan);animation:glitchBot 4.7s infinite steps(1);}
  @keyframes glitchTop{
    0%,92%{clip-path:inset(0 0 100% 0);transform:translate(0,0);}
    93%{clip-path:inset(10% 0 60% 0);transform:translate(-2px,-1px);}
    95%{clip-path:inset(40% 0 20% 0);transform:translate(2px,1px);}
    97%,100%{clip-path:inset(0 0 100% 0);}}
  @keyframes glitchBot{
    0%,90%{clip-path:inset(100% 0 0 0);transform:translate(0,0);}
    91%{clip-path:inset(60% 0 10% 0);transform:translate(2px,1px);}
    94%{clip-path:inset(20% 0 45% 0);transform:translate(-2px,-1px);}
    96%,100%{clip-path:inset(100% 0 0 0);}}
  .subtitle{font-size:12px;letter-spacing:4px;color:var(--text-dim);}
  .terminal{background:rgba(12,15,22,.7);border:1px solid var(--green-dim);padding:16px 20px;
    min-width:min(420px,80vw);font-size:13px;line-height:1.9;box-shadow:0 0 24px rgba(61,255,160,.08);}
  .terminal .line{opacity:0;white-space:pre;}
  .terminal .line.done{opacity:1;}
  .cursor{display:inline-block;width:8px;background:var(--green);animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){
    h1 .glitch::before,h1 .glitch::after{animation:none;display:none;}
    canvas#rain{opacity:.15;}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<main>
  <svg id="skull" viewBox="0 0 160 160"></svg>
  <h1><span class="glitch" data-text="HACKED BY">HACKED BY</span><br><span class="glitch" data-text="ACE">QIHO</span></h1>
  <div class="subtitle">SYSTEM PERIMETER BREACHED</div>
  <div class="terminal" id="term"></div>
</main>
<script>
const bmp=["0000111111110000","0001111111111000","0011111111111100","0111111111111110",
"0111111111111110","1111001111001111","1111001111001111","1111111111111111",
"1111111111111111","1111111111111111","0111111111111110","0011111111111100",
"0001100000011000","0001100000011000","0011000000001100","0011000000001100"];
const svg=document.getElementById('skull');const s=10;let markup='';
bmp.forEach((row,y)=>{[...row].forEach((c,x)=>{
  if(c==='1')markup+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#3dffa0"/>`;
});});
svg.innerHTML=markup;

const canvas=document.getElementById('rain');const ctx=canvas.getContext('2d');
let w,h,cols,drops;
function size(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;
  cols=Math.floor(w/16);drops=new Array(cols).fill(0);}
size();addEventListener('resize',size);
const chars='01ABCDEF#$%&アイウエオカ';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){
  ctx.fillStyle='rgba(6,7,12,0.08)';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#3dffa0';ctx.font='14px monospace';
  drops.forEach((y,i)=>{
    const ch=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(ch,i*16,y*16);
    if(y*16>h&&Math.random()>0.975)drops[i]=0;else drops[i]=y+1;
  });
}
if(!reduced)setInterval(draw,60);else{ctx.fillStyle='rgba(6,7,12,1)';ctx.fillRect(0,0,innerWidth,innerHeight);}

const lines=["> initiating breach sequence...","> bypassing firewall [OK]","> access_level: ROOT",
"> target: security perimeter","> status: COMPROMISED","> signed, ???"];
const term=document.getElementById('term');let li=0;
function typeLine(){
  if(li>=lines.length)return;
  const el=document.createElement('div');el.className='line';term.appendChild(el);
  const text=lines[li];let ci=0;
  const iv=setInterval(()=>{
    el.textContent=text.slice(0,ci+1);el.classList.add('done');ci++;
    if(ci>=text.length){clearInterval(iv);li++;setTimeout(typeLine,260);}
  },22);
}
typeLine();
</script>
</body>
</html>
